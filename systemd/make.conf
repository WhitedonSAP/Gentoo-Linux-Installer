# Gentoo make.conf optimized by GLI (Systemd)

COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Automatically set by GLI
CPU_FLAGS_X86="xCPU_FLAGS_X86x"
MAKEOPTS="-jxMAKEOPTSx"
VIDEO_CARDS="xVIDEO_CARDSx"

# Compilation Options
ACCEPT_LICENSE="*"
FEATURES="parallel-fetch"
EMERGE_DEFAULT_OPTS="--keep-going --with-bdeps=y"

# Hardware Devices
INPUT_DEVICES="libinput"

# System Language
L10N="en en-US"
LINGUAS="en en_US"
LC_MESSAGES=C.utf8

# USE Flags (Systemd Profile)
USE="X acpi dbus networkmanager nls pipewire systemd vulkan wayland"
